<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACR Review</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1f2328; --muted: #5d6570; --line: #dcd9d2;
    --accent: #1f5f7a; --accent-soft: #e3eef2; --warn: #9a3412; --warn-soft: #fbece4; --ok: #2f6b3a; --ok-soft: #e6f1e7;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181b; --panel: #1f2226; --ink: #e8e6e1; --muted: #a0a7b0; --line: #34383e;
      --accent: #7fb8cf; --accent-soft: #1d3440; --warn: #f0a57f; --warn-soft: #3a2419; --ok: #8fc79a; --ok-soft: #1e3322; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  select, input[type=file] { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
  .check input { margin-top: 5px; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; margin-top: 18px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0e1a20; } }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .error { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 12px 14px; margin-top: 16px; white-space: pre-line; }
  .banner { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: .92rem; margin-bottom: 16px; }
  .summary { font-size: 1.08rem; }
  .fix { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; margin: 16px 0; }
  .fix.p1 { border-color: var(--warn); }
  .fix h3 { margin: 0 0 6px; font-size: 1rem; }
  .ev { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; display: inline-block; margin: 4px 0; }
  .unverified { color: var(--warn); font-size: .85rem; }
  .k { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; margin-top: 8px; }
  .strength { border-left: 4px solid var(--ok); padding: 4px 0 4px 14px; margin: 12px 0; }
  ul.q { padding-left: 20px; } ul.q li { margin: 8px 0; }
  .think { background: var(--accent-soft); border-radius: 8px; padding: 14px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.score { font-weight: 700; white-space: nowrap; }
  details { margin-top: 14px; } summary { cursor: pointer; font-weight: 600; }
  .muted { color: var(--muted); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  @media print { form, .actions, .noprint { display: none !important; } body { background: #fff; } .panel { border: 0; } }
</style>
</head>
<body>
<main>
  <h1>ACR Review</h1>
  <p class="sub">Upload your practice ACR from a lab scenario. You get feedback the way your instructor would give it after the scenario: what to keep, what to fix first, and a few questions.</p>

  <form id="form" class="panel">
    <div id="modeBanner" class="banner" hidden></div>
    <label for="scenario">Which scenario was this?</label>
    <select id="scenario" name="scenarioId"><option value="">Not from a listed scenario</option></select>
    <label for="file">Your ACR (the Practice ACR v3 PDF)</label>
    <input id="file" name="acr" type="file" accept="application/pdf,.pdf" required>
    <label class="check"><input type="checkbox" id="confirm" required>
      <span>This is a practice chart from a lab scenario. It has no real patient information in it. I have not uploaded an ACR from a real call or a placement.</span></label>
    <div class="actions">
      <button id="go" type="submit">Review my ACR</button>
    </div>
    <div id="err" class="error" hidden></div>
  </form>

  <section id="out" hidden></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let lastFeedback = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function init() {
  try {
    const r = await fetch('api/acr-review/scenarios');
    const d = await r.json();
    for (const s of d.scenarios) {
      const o = document.createElement('option'); o.value = s.id; o.textContent = s.title; o.title = s.summary; $('#scenario').append(o);
    }
    if (d.mode === 'mock') {
      $('#modeBanner').hidden = false;
      $('#modeBanner').textContent = 'Practice mode: feedback comes from the rule-based checker only, without the AI reviewer. Useful for testing, but it can only catch what the rules know about.';
    }
  } catch (e) { /* scenario list is optional */ }
}

$('#form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('#err').hidden = true;
  if (!$('#confirm').checked) return;
  const fd = new FormData();
  fd.append('acr', $('#file').files[0]);
  fd.append('scenarioId', $('#scenario').value);
  fd.append('practiceConfirm', 'yes');
  if (lastFeedback) fd.append('previousFeedback', JSON.stringify(lastFeedback));
  $('#go').disabled = true; $('#go').textContent = 'Reviewing...';
  try {
    const r = await fetch('api/acr-review', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'The review failed.');
    render(d);
    lastFeedback = d.feedback;
    $('#go').textContent = 'Review my revised ACR';
  } catch (e) {
    $('#err').textContent = e.message; $('#err').hidden = false;
    $('#go').textContent = lastFeedback ? 'Review my revised ACR' : 'Review my ACR';
  } finally { $('#go').disabled = false; }
});

function ev(item) {
  return `<div><span class="ev">${esc(item.evidence)}</span>${item.evidence_verified === false ? ' <span class="unverified">not found on your chart, check this one</span>' : ''}</div>`;
}

function render(d) {
  const f = d.feedback;
  const parts = [];
  parts.push(`<h2>${d.scenario ? esc(d.scenario.title) + ': ' : ''}call ${esc(d.chart.callNumber || '')}</h2>`);
  parts.push(`<div class="panel">`);
  if (f.meta && f.meta.mode === 'mock') parts.push(`<div class="banner">Rule-based feedback (practice mode).</div>`);
  parts.push(`<p class="summary">${esc(f.summary)}</p>`);

  if (f.improvement_since_last && f.improvement_since_last.length) {
    parts.push(`<div class="k">Since your last version</div><ul class="q">${f.improvement_since_last.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`);
  }
  if (f.fixes.length) {
    parts.push(`<div class="k">Fix these first</div>`);
    for (const x of f.fixes) {
      parts.push(`<div class="fix p${x.priority}"><h3>${x.priority}. ${esc(x.issue)}</h3>${ev(x)}
        <p><strong>Why it matters:</strong> ${esc(x.why_it_matters)}</p><p><strong>What to do:</strong> ${esc(x.what_to_do)}</p></div>`);
    }
  }
  if (f.strengths.length) {
    parts.push(`<div class="k">Keep doing this</div>`);
    for (const x of f.strengths) parts.push(`<div class="strength">${esc(x.point)}${ev(x)}</div>`);
  }
  if (f.scenario_questions.length) {
    parts.push(`<div class="k">Your chart and the scenario</div><ul class="q">${f.scenario_questions.map((q) => `<li>${esc(q.question)}</li>`).join('')}</ul>`);
  }
  if (f.question_to_think_about) parts.push(`<div class="k">Something to think about</div><p class="think">${esc(f.question_to_think_about)}</p>`);
  if (f.model_sentence && f.model_sentence.offered && f.model_sentence.text) {
    parts.push(`<div class="k">One example sentence</div><p class="ev" style="display:block">${esc(f.model_sentence.text)}</p><p class="muted">${esc(f.model_sentence.note)}</p>`);
  }
  parts.push(`<div class="k">Documentation rubric${f.meta && f.meta.rubric_total ? ' (' + esc(f.meta.rubric_total) + ')' : ''}</div>
    <table><thead><tr><th>Domain</th><th>Score</th><th>Why</th></tr></thead><tbody>
    ${f.rubric.map((r) => `<tr><td>${esc(r.domain)}</td><td class="score">${r.score === null ? 'n/a' : r.score + ' / 7'}</td><td>${esc(r.evidence)}</td></tr>`).join('')}
    </tbody></table>`);
  parts.push(`<details><summary>What the checker found (${d.checker.issues.length})</summary>
    ${d.checker.issues.length ? `<ul class="q">${d.checker.issues.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : '<p class="muted">Nothing.</p>'}
    <div class="k">Questions it couldn't answer</div><ul class="q">${d.checker.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>
    <div class="k">Call intervals</div><pre class="muted">${esc(d.checker.intervals)}</pre></details>`);
  if (f.instructor_flags && f.instructor_flags.length) {
    parts.push(`<details><summary>For your instructor (${f.instructor_flags.length})</summary><ul class="q">${f.instructor_flags.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>`);
  }
  parts.push(`<div class="actions noprint"><button class="secondary" onclick="window.print()">Print or save this feedback</button>
    <button class="secondary" onclick="document.getElementById('file').value='';window.scrollTo({top:0,behavior:'smooth'})">Upload a revised version</button></div>`);
  parts.push(`<p class="muted" style="margin-top:18px;font-size:.85rem">Fix your chart in Acrobat, then upload the revised version here. The review will say what changed. Nothing you upload is stored.</p>`);
  parts.push(`</div>`);
  $('#out').innerHTML = parts.join('');
  $('#out').hidden = false;
  $('#out').scrollIntoView({ behavior: 'smooth' });
}
init();
</script>
</body>
</html>
